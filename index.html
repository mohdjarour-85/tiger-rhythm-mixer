/* ---------- توليف الإيقاعات (Percussion Synthesis) ---------- */
function noiseBuffer(ctx, duration) {
  const sr = ctx.sampleRate;
  const len = Math.max(1, Math.floor(sr * duration));
  const buf = ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}
/* دم — نغمة الدربكة العميقة + طبقة احتكاك جلد خفيفة عند الضربة */
function hitDum(ctx, t) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(160, t);
  osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(1.0, t + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.36);

  const skinSrc = ctx.createBufferSource();
  skinSrc.buffer = noiseBuffer(ctx, 0.03);
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 220;
  bp.Q.value = 1.5;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.35, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  skinSrc.connect(bp).connect(ng).connect(ctx.destination);
  skinSrc.start(t);
}
/* تك — نقرة حادة على حافة الدربكة مع رنة قصيرة */
function hitTak(ctx, t) {
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, 0.045);
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 3400;
  bp.Q.value = 5;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.65, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  src.connect(bp).connect(gain).connect(ctx.destination);
  src.start(t);

  const osc = ctx.createOscillator();
  osc.type = "triangle";
  osc.frequency.value = 1800;
  const og = ctx.createGain();
  og.gain.setValueAtTime(0.15, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
  osc.connect(og).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.03);
}
function hitClap(ctx, t) {
  for (let k = 0; k < 3; k++) {
    const dt = k * 0.01;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 0.08);
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1500;
    bp.Q.value = 1.2;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t + dt);
    gain.gain.linearRampToValueAtTime(0.5, t + dt + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.12);
    src.connect(bp).connect(gain).connect(ctx.destination);
    src.start(t + dt);
  }
}
function hitHat(ctx, t, open) {
  const dur = open ? 0.25 : 0.045;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, dur);
  const hp = ctx.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 7500;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.32, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(hp).connect(gain).connect(ctx.destination);
  src.start(t);
}
function hitCrash(ctx, t) {
  const dur = 0.7;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, dur);
  const hp = ctx.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 4500;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.4, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(hp).connect(gain).connect(ctx.destination);
  src.start(t);
}
async function synthesizeBar(slots, stepsPerBeat, bpm, sampleRate) {
  const beatDur = 60 / bpm;
  const slotDur = beatDur / (stepsPerBeat || 2);
  const barDuration = slots.length * slotDur;
  const length = Math.ceil(barDuration * sampleRate) + 4096;
  const ctx = new OfflineAudioContext(2, length, sampleRate);
  slots.forEach((type, i) => {
    const t = i * slotDur;
    if (type === "dum") hitDum(ctx, t);
    else if (type === "tak") hitTak(ctx, t);
    else if (type === "clap") hitClap(ctx, t);
    else if (type === "hat") hitHat(ctx, t, false);
    else if (type === "hatO") hitHat(ctx, t, true);
    else if (type === "crash") hitCrash(ctx, t);
  });
  const rendered = await ctx.startRendering();
  const barLen = Math.floor(barDuration * sampleRate);
  const trimmed = new AudioBuffer({ length: Math.max(1, barLen), numberOfChannels: rendered.numberOfChannels, sampleRate });
  for (let ch = 0; ch < rendered.numberOfChannels; ch++) {
    trimmed.copyToChannel(rendered.getChannelData(ch).slice(0, barLen), ch);
  }
  return trimmed;
}
/* يبني عبارة من 4 مازورات: 3 عادية + تقسيمة (fill) وحدة — يعطي إحساس لوب جاهز متنوع بدل التكرار الثابت (احتياطي إذا ما فيه جريد نبضات محسوب) */
async function buildPhraseBuffer(pattern, bpm, sampleRate) {
  const normalBar = await synthesizeBar(pattern.slots, pattern.stepsPerBeat, bpm, sampleRate);
  const fillBar = await synthesizeBar(pattern.fill || pattern.slots, pattern.stepsPerBeat, bpm, sampleRate);
  return concatBuffers([normalBar, normalBar, normalBar, fillBar]);
}
/* يبني الإيقاع بالمحاذاة الحقيقية: كل دم/تك يُحسب ويُحط بالضبط على وقت النبضة الفعلية بالجريد، بدل سرعة ثابتة مفترضة */
async function buildGridLockedRhythm(pattern, beatGrid, startTime, endTime, sampleRate, offsetSec, phase) {
  if (!beatGrid || beatGrid.length < 3) return null;
  offsetSec = offsetSec || 0;
  phase = phase || 0;
  const stepsPerBeat = pattern.stepsPerBeat || 2;
  const beatsPerBar = pattern.slots.length / stepsPerBeat;
  const duration = Math.max(0.05, endTime - startTime);
  const length = Math.ceil(duration * sampleRate) + 2048;
  const ctx = new OfflineAudioContext(2, length, sampleRate);

  for (let i = 0; i < beatGrid.length - 1; i++) {
    const b0 = beatGrid[i], b1 = beatGrid[i + 1];
    if (b1 <= startTime) continue;
    if (b0 >= endTime) break;
    const beatInBar = ((i + phase) % beatsPerBar + beatsPerBar) % beatsPerBar;
    const barIdx = Math.floor((i + phase) / beatsPerBar);
    const useFill = !!pattern.fill && barIdx % 4 === 3;
    const slots = useFill ? pattern.fill : pattern.slots;
    const beatDur = b1 - b0;
    for (let s = 0; s < stepsPerBeat; s++) {
      const type = slots[beatInBar * stepsPerBeat + s];
      if (!type || type === "-") continue;
      const tReal = b0 + (beatDur * s) / stepsPerBeat + offsetSec;
      if (tReal < startTime || tReal >= endTime) continue;
      const tLocal = tReal - startTime;
      if (type === "dum") hitDum(ctx, tLocal);
      else if (type === "tak") hitTak(ctx, tLocal);
      else if (type === "clap") hitClap(ctx, tLocal);
      else if (type === "hat") hitHat(ctx, tLocal, false);
      else if (type === "hatO") hitHat(ctx, tLocal, true);
      else if (type === "crash") hitCrash(ctx, tLocal);
    }
  }
  return await ctx.startRendering();
}

/* يحسب قائمة أوقات الضربات (بدون توليف صوت) لعرضها مرئيًا — نفس منطق البناء الصوتي بالضبط */
function computeHitList(pattern, beatGrid, startTime, endTime, bpm, offsetSec, phase) {
  offsetSec = offsetSec || 0;
  const hits = [];
  const stepsPerBeat = pattern.stepsPerBeat || 2;
  if (beatGrid && beatGrid.length > 2) {
    phase = phase || 0;
    const beatsPerBar = pattern.slots.length / stepsPerBeat;
    for (let i = 0; i < beatGrid.length - 1; i++) {
      const b0 = beatGrid[i], b1 = beatGrid[i + 1];
      if (b1 <= startTime) continue;
      if (b0 >= endTime) break;
      const beatInBar = ((i + phase) % beatsPerBar + beatsPerBar) % beatsPerBar;
      const barIdx = Math.floor((i + phase) / beatsPerBar);
      const useFill = !!pattern.fill && barIdx % 4 === 3;
      const slots = useFill ? pattern.fill : pattern.slots;
      const beatDur = b1 - b0;
      for (let s = 0; s < stepsPerBeat; s++) {
        const type = slots[beatInBar * stepsPerBeat + s];
        if (!type || type === "-") continue;
        const t = b0 + (beatDur * s) / stepsPerBeat + offsetSec;
        if (t < startTime || t >= endTime) continue;
        hits.push({ time: t, type });
      }
    }
  } else {
    const slotDur = 60 / bpm / stepsPerBeat;
    let t = startTime + offsetSec;
    let slotIdx = 0;
    let barIdx = 0;
    let guard = 0;
    while (t < endTime && guard++ < 20000) {
      const useFill = !!pattern.fill && barIdx % 4 === 3;

/* ---------- إخراج نهائي: تلميع وتطبيع المستوى ---------- */
function normalizePeak(buffer, targetDb) {
  let peak = 0;
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    const data = buffer.getChannelData(ch);
    for (let i = 0; i < data.length; i++) {
      const a = Math.abs(data[i]);
      if (a > peak) peak = a;
    }
  }
  if (peak <= 0.0001) return buffer;
  const targetLin = Math.pow(10, targetDb / 20);
  const gain = targetLin / peak;
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    const data = buffer.getChannelData(ch);
    for (let i = 0; i < data.length; i++) data[i] *= gain;
  }
  return buffer;
}
function limitClipping(buffer) {
  let peak = 0;
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    const data = buffer.getChannelData(ch);
    for (let i = 0; i < data.length; i++) {
      const a = Math.abs(data[i]);
      if (a > peak) peak = a;
    }
  }
  if (peak > 1) {
    const g = 0.99 / peak;
    for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < data.length; i++) data[i] *= g;
    }
  }
  return buffer;
}
/* إعادة أخذ عينات فعلية لمعدل تسليم مختلف (مثل 48kHz) — خطوة منفصلة بعد اكتمال الدمج، تستخدم محرك إعادة العينات المدمج بالمتصفح */
async function resampleTo(buffer, targetRate) {
  if (!targetRate || buffer.sampleRate === targetRate) return buffer;
  const newLength = Math.ceil(buffer.duration * targetRate);
  const ctx = new OfflineAudioContext(buffer.numberOfChannels, newLength, targetRate);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  src.start(0);
  return await ctx.startRendering();
}
/* ---------- دمج مباشر بالعينات: أوثق من جدولة تشغيل (loop/duration) عبر AudioContext ---------- */
function buildMix(songBuffer, rhythmBuffer, rhythmStart, rhythmEnd, songVol, rhythmVol, windowStart, windowEnd) {
  const sr = songBuffer.sampleRate;
  const wStart = Math.max(0, Math.round(windowStart * sr));
  const wEnd = Math.min(songBuffer.length, Math.round(windowEnd * sr));
  const len = Math.max(1, wEnd - wStart);
  const numChannels = Math.max(songBuffer.numberOfChannels, rhythmBuffer ? rhythmBuffer.numberOfChannels : 1, 1);
  const out = new AudioBuffer({ length: len, numberOfChannels: numChannels, sampleRate: sr });
  const rStart = Math.round(rhythmStart * sr);
  const rEnd = Math.round(rhythmEnd * sr);
  const rLen = rhythmBuffer ? rhythmBuffer.length : 0;
  for (let ch = 0; ch < numChannels; ch++) {
    const songCh = ch < songBuffer.numberOfChannels ? songBuffer.getChannelData(ch) : songBuffer.getChannelData(0);
    const rhyCh = rhythmBuffer ? (ch < rhythmBuffer.numberOfChannels ? rhythmBuffer.getChannelData(ch) : rhythmBuffer.getChannelData(0)) : null;
    const dst = out.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const g = wStart + i;
      let v = (g < songBuffer.length ? songCh[g] : 0) * songVol;
      if (rhyCh && rLen > 0 && g >= rStart && g < rEnd) {
        v += rhyCh[(g - rStart) % rLen] * rhythmVol;
      }
      dst[i] = v;
    }
  }
  return out;
}

/* ---------- تصدير MP3 عبر lamejs (تشفير بالمتصفح، بدون سيرفر) ---------- */
function floatTo16BitPCM(floatArr) {
  const out = new Int16Array(floatArr.length);
  for (let i = 0; i < floatArr.length; i++) {
    let s = Math.max(-1, Math.min(1, floatArr[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}
function audioBufferToMp3(buffer, kbps) {
  if (typeof lamejs === "undefined") throw new Error("مكتبة تصدير MP3 ما تحمّلت (تحقق من الاتصال بالإنترنت)");
  kbps = kbps || 192;
  const numChannels = Math.min(2, buffer.numberOfChannels);
  const sampleRate = buffer.sampleRate;
  const encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);
  const blockSize = 1152;
  const left = floatTo16BitPCM(buffer.getChannelData(0));
  const right = numChannels > 1 ? floatTo16BitPCM(buffer.getChannelData(1)) : null;
  const chunks = [];
  for (let i = 0; i < left.length; i += blockSize) {
    const leftChunk = left.subarray(i, i + blockSize);
    let mp3buf;
    if (numChannels > 1) {
      const rightChunk = right.subarray(i, i + blockSize);
      mp3buf = encoder.encodeBuffer(leftChunk, rightChunk);
    } else {
      mp3buf = encoder.encodeBuffer(leftChunk);
    }
    if (mp3buf.length > 0) chunks.push(mp3buf);
  }
  const end = encoder.flush();
  if (end.length > 0) chunks.push(end);
  return new Blob(chunks, { type: "audio/mp3" });
}

/* ---------- تصدير WAV (16 أو 24 بت) ---------- */
function audioBufferToWav(buffer, bitDepth) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const bytesPerSample = bitDepth === 24 ? 3 : 2;
  const blockAlign = numChannels * bytesPerSample;
  const dataSize = numFrames * blockAlign;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);
  const writeStr = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeStr(36, "data");
  view.setUint32(40, dataSize, true);

  const channels = [];
  for (let ch = 0; ch < numChannels; ch++) channels.push(buffer.getChannelData(ch));
  let offset = 44;
  for (let i = 0; i < numFrames; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const s = Math.max(-1, Math.min(1, channels[ch][i]));
      if (bitDepth === 24) {
        const iv = Math.round(s < 0 ? s * 0x800000 : s * 0x7fffff);
        view.setUint8(offset, iv & 0xff);
        view.setUint8(offset + 1, (iv >> 8) & 0xff);
        view.setUint8(offset + 2, (iv >> 16) & 0xff);
        offset += 3;
      } else {
        const iv = s < 0 ? s * 0x8000 : s * 0x7fff;
        view.setInt16(offset, iv, true);
        offset += 2;
      }
    }
  }
  return new Blob([ab], { type: "audio/wav" });
}

/* ---------- أدوات مساعدة ---------- */
/* يحدّ من دقة رسم الكانفاس حتى ما يتجاوز الحد الأقصى المسموح بالمتصفح عند تكبير عالي (كان يسبب رسم أبيض/فاشل) */
function safeCanvasScale(cssWidth) {
  const dpr = window.devicePixelRatio || 1;
  const maxPx = 8000;
  if (cssWidth * dpr > maxPx) return Math.max(1, maxPx / cssWidth);
  return dpr;
}
function fmtTime(s) {
  if (!isFinite(s)) return "٠:٠٠";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, "0")}`;
}
function computePeaks(buffer, bins) {
  const data = buffer.getChannelData(0);
  const per = Math.max(1, Math.floor(data.length / bins));
  const peaks = new Float32Array(bins);
  for (let i = 0; i < bins; i++) {
    let max = 0;
    const start = i * per;
    for (let j = 0; j < per; j++) {
      const v = Math.abs(data[start + j] || 0);
      if (v > max) max = v;
    }
    peaks[i] = max;
  }
  return peaks;
}

      const elapsed = ctx.currentTime - playStartRef.current.ctxTime;
      const t = playStartRef.current.windowStart + elapsed;
      playheadTimeRef.current = t;
      drawPlayhead(t);
      autoScrollTo(t);
      rafRef.current = requestAnimationFrame(tick);
    };

    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
    drawPlayhead(null);
  };
  const drawPlayhead = (t) => {
    const canvas = overlayCanvasRef.current;
    if (!canvas || !songBuffer) return;
    const cssWidth = canvas.clientWidth || canvas.width;
    const dpr = safeCanvasScale(cssWidth);
    const g = canvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, canvas.width, canvas.height);
    if (t == null) return;
    g.scale(dpr, dpr);
    const width = canvas.width / dpr;
    const height = canvas.height / dpr;
    const x = (t / songBuffer.duration) * width;
    g.strokeStyle = "#FFFFFF";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x, 0);
    g.lineTo(x, height);
    g.stroke();
  };

    if (!scroller || !songBuffer || !autoFollowRef.current) return;
    const width = scroller.scrollWidth;
    if (!width) return;
    const x = (t / songBuffer.duration) * width;
    const viewW = scroller.clientWidth;
    if (viewW >= width) return;
    const target = Math.max(0, Math.min(width - viewW, x - viewW / 2));

  };

      setPeaks(computePeaks(prev, 900));

      const ctx = getCtx();
      const added = [];
      for (const file of files) {
        try {
          const arr = await file.arrayBuffer();
          const buf = await ctx.decodeAudioData(arr);
          added.push({ name: file.name, buffer: buf });
        } catch (err) {}
      }
      if (!added.length) {
        setStatus("تعذّرت قراءة الملفات. جرّب mp3 أو wav.");

      }
      setSongFiles((prev) => {
        const merged = [...prev, ...added];
        return merged;
      });
      const first = added[0];
      setActiveSongIdx(songFiles.length);
      loadSongIntoState(first.buffer, first.name);
    } finally {
      setLoadingSong(false);
    }
  };

  const switchToSong = (idx) => {

    if (!f) return;
    setActiveSongIdx(idx);
    loadSongIntoState(f.buffer, f.name);

      detectedBpm = res.bpm;
      grid = res.beatGrid;
      usedEssentia = true;

      setStatus("essentia.js ما اشتغلت (" + String(essErr.message || essErr) + ") — رجعنا للخوارزمية الاحتياطية...");
      await new Promise((r) => setTimeout(r, 30));

        detectedBpm = res.bpm;
        grid = res.beatGrid;

        setStatus("تعذّر التحليل التلقائي: " + String(err.message || err));
        return;
      }
    }
    try {
      setBpm(detectedBpm);
      setBeatGrid(grid);
      setRhythmBeatGrid(grid);
      setRhythmAnchorSec(grid.length ? grid[0] : 0);
      setSnapToGrid(true);

  const handleReanalyzeRange = async () => {
    if (!songBuffer) return;

    try {
      const padStart = Math.max(0, startTime - 1);
      const padEnd = Math.min(songBuffer.duration, endTime + 1);

      const shifted = segGrid.map((t) => t + padStart);

    } catch (err) {

      setStatus("تعذّر بناء الجريد: " + String(err.message || err));

  };

  const handleLoopFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const ctx = getCtx();
    const added = [];
    for (const file of files) {
      try {
        const arr = await file.arrayBuffer();

      } catch (err) {}

  useEffect(() => {
    if (!songBuffer) return;

    const baseWidth = container.clientWidth;
    const width = Math.max(baseWidth, baseWidth * zoom);
    const height = 220;
    const dpr = safeCanvasScale(width);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    const g = canvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.scale(dpr, dpr);
    g.clearRect(0, 0, width, height);

    const duration = songBuffer.duration;
    const physicalWidth = width * dpr;
    const bins = Math.max(200, Math.min(20000, Math.floor(physicalWidth), Math.round(900 * zoom)));
    const displayPeaks = computePeaks(songBuffer, bins);

    g.fillStyle = "rgba(201,162,39,0.10)";
    g.fillRect(startX, 0, Math.max(0, endX - startX), height);

    const mid = height / 2;
    const barW = width / displayPeaks.length;
    for (let i = 0; i < displayPeaks.length; i++) {
      const x = i * barW;
      const inRhythm = x >= startX && x <= endX;
      const h = Math.max(1.5, displayPeaks[i] * (mid - 6));
      g.fillStyle = inRhythm ? COLORS.goldSoft : "rgba(244,238,224,0.35)";
      g.fillRect(x, mid - h, Math.max(1, barW - 1), h * 2);
    }

    g.strokeStyle = COLORS.line;
    g.beginPath();
    g.moveTo(0, mid);
    g.lineTo(width, mid);

    if (beatGrid.length > 0) {
      g.strokeStyle = "rgba(255,255,255,0.28)";

        g.moveTo(bx, 0);
        g.lineTo(bx, height);

      g.strokeStyle = "#FFFFFF";
      g.lineWidth = 2;
      const tickLen = 14;

        const bx = (bt / duration) * width;
        if (bx < 0 || bx > width) continue;
        g.beginPath();
        g.moveTo(bx, 0);
        g.lineTo(bx, tickLen);
        g.stroke();
        g.beginPath();
        g.moveTo(bx, height - tickLen);
        g.lineTo(bx, height);
        g.stroke();
      }
    }

    g.fillStyle = COLORS.gold;
    g.beginPath();
    g.moveTo(startX - 7, 0);
    g.lineTo(startX + 7, 0);
    g.lineTo(startX, 12);
    g.closePath();
    g.fill();
    g.fillRect(startX - 1.2, 0, 2.4, height);

    g.fillStyle = COLORS.coral;
    g.beginPath();
    g.moveTo(endX - 7, height);
    g.lineTo(endX + 7, height);
    g.lineTo(endX, height - 12);
    g.closePath();
    g.fill();
    g.fillRect(endX - 1.2, 0, 2.4, height);

    const overlay = overlayCanvasRef.current;
    if (overlay) {
      overlay.width = width * dpr;
      overlay.height = height * dpr;
      overlay.style.width = width + "px";
      overlay.style.height = height + "px";
    }
  }, [songBuffer, startTime, endTime, beatGrid, zoom]);

  useEffect(() => {
    if (!songBuffer) return;
    const scroller = scrollRef.current;
    if (!scroller) return;
    const t = requestAnimationFrame(() => {
      const width = scroller.scrollWidth;
      const viewW = scroller.clientWidth;
      if (!width || viewW >= width) return;
      const x = (startTime / songBuffer.duration) * width;
      scroller.scrollLeft = Math.max(0, Math.min(width - viewW, x - viewW / 2));
    });
    return () => cancelAnimationFrame(t);
    // eslint-disable-next-line
  }, [zoom]);

  useEffect(() => {
    if (!songBuffer) return;
    const canvas = rhythmCanvasRef.current;
    const container = containerRef.current;
    if (!canvas || !container) return;
    const baseWidth = container.clientWidth;
    const width = Math.max(baseWidth, baseWidth * zoom);
    const height = 64;
    const dpr = safeCanvasScale(width);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    const g = canvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.scale(dpr, dpr);
    g.clearRect(0, 0, width, height);
    g.fillStyle = "#0D0620";
    g.fillRect(0, 0, width, height);

    const duration = songBuffer.duration;
    const offsetSec = syncOffsetMs / 1000;
    if (rhythmMode === "builtin") {
      const pattern = PATTERNS.find((p) => p.id === patternId);
      const hits = computeHitList(pattern, rhythmBeatGrid, startTime, endTime, bpm, offsetSec, patternPhase);
      for (const h of hits) {
        const x = (h.time / duration) * width;
        g.fillStyle = HIT_COLORS[h.type] || "#fff";
        const r = h.type === "dum" ? 6 : 4;
        g.beginPath();
        g.arc(x, height / 2, r, 0, Math.PI * 2);
        g.fill();
      }
    } else {
      const loop = myLoops[activeLoopIdx];
      if (loop && loop.buffer) {
        const activeBuf = loopSyncEnabled ? getSyncedLoopBuffer(loop.buffer, rhythmBeatGrid, startTime, endTime, bpm, loopBeatsCount, preservePitch) : loop.buffer;
        const rStart = startTime + offsetSec;
        const rEnd = endTime + offsetSec;
        const rLen = activeBuf.length;
        const sr = activeBuf.sampleRate;
        const loopPeaks = computePeaks(activeBuf, Math.max(60, Math.round(200 * (activeBuf.duration || 1))));
        const startX = (rStart / duration) * width;
        const endX = (rEnd / duration) * width;
        g.fillStyle = "rgba(226,96,79,0.08)";
        g.fillRect(startX, 0, Math.max(0, endX - startX), height);
        const stepSec = Math.max(0.0015, 0.02 / Math.max(1, zoom));
        let iterGuard = 0;
        for (let t = Math.max(0, rStart); t < Math.min(duration, rEnd) && iterGuard < 200000; t += stepSec) {
          iterGuard++;
          const phase = ((t - rStart) * sr) % rLen;
          const bin = Math.min(loopPeaks.length - 1, Math.floor((phase / rLen) * loopPeaks.length));
          const amp = loopPeaks[bin];
          const x = (t / duration) * width;
          const h = Math.max(1, amp * (height / 2 - 4));
          g.fillStyle = COLORS.coral;
          g.fillRect(x, height / 2 - h, 1.5, h * 2);
        }
        g.strokeStyle = "rgba(255,255,255,0.5)";
        g.lineWidth = 1;
        const loopDur = activeBuf.duration;
        for (let t = rStart; t < rEnd; t += loopDur) {
          const x = (t / duration) * width;
          g.beginPath();
          g.moveTo(x, 0);
          g.lineTo(x, height);
          g.stroke();
        }
      } else {
        g.fillStyle = COLORS.muted;
        g.font = "12px Cairo";
        g.textAlign = "center";
        g.fillText("ارفع لوب من قسم \"لوباتي الخاصة\" حتى يظهر هنا", width / 2, height / 2 + 4);
      }
    }

    if (rhythmBeatGrid.length > 0) {
      g.strokeStyle = "#FFFFFF";
      g.lineWidth = 1.5;
      for (const bt of rhythmBeatGrid) {
        const bx = (bt / duration) * width;
        if (bx < 0 || bx > width) continue;
        g.beginPath();
        g.moveTo(bx, 0);
        g.lineTo(bx, 8);
        g.stroke();
        g.beginPath();
        g.moveTo(bx, height - 8);
        g.lineTo(bx, height);
        g.stroke();
      }
    }
  }, [songBuffer, startTime, endTime, rhythmBeatGrid, zoom, rhythmMode, patternId, bpm, myLoops, activeLoopIdx, syncOffsetMs, loopSyncEnabled, loopBeatsCount, preservePitch, patternPhase]);

  const timeFromEvent = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const x = Math.min(Math.max(clientX - rect.left, 0), rect.width);
    return (x / rect.width) * songBuffer.duration;
  };
  const onPointerDown = (e) => {
    if (!songBuffer) return;
    const t = timeFromEvent(e);
    if (markGridMode) {
      let anchor = t;
      if (snapToGrid && beatGrid.length > 0) anchor = nearestBeat(beatGrid, t);
      setRhythmAnchorSec(anchor);
      setRhythmBeatGrid(buildForwardGrid(anchor, bpm, songBuffer.duration));
      setStatus(`الجريد صار يبدأ من ${fmtTime(anchor)} فصاعدًا`);
      return;
    }
    setDragging(Math.abs(t - startTime) <= Math.abs(t - endTime) ? "start" : "end");
  };
  const onPointerMove = (e) => {
    if (!dragging || !songBuffer) return;
    let t = timeFromEvent(e);
    if (snapToGrid && beatGrid.length > 0) t = nearestBeat(beatGrid, t);
    if (dragging === "start") {
      const v = Math.min(t, endTime);
      setStartTime(v);
      setRhythmAnchorSec(v);
      setRhythmBeatGrid(buildForwardGrid(v, bpm, songBuffer.duration));
    } else {
      setEndTime(Math.max(t, startTime + 0.05));
    }
  };
  const onPointerUp = () => setDragging(null);

  const handleTap = () => {
    const now = performance.now();
    const arr = tapTimesRef.current.filter((t) => now - t < 2200);
    arr.push(now);
    tapTimesRef.current = arr;
    if (arr.length >= 2) {
      const intervals = [];
      for (let i = 1; i < arr.length; i++) intervals.push(arr[i] - arr[i - 1]);
      const avg = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      const newBpm = Math.round(60000 / avg);
      if (newBpm >= 40 && newBpm <= 220) setBpm(newBpm);
    }
  };

  const doCopy = () => {
    if (!songBuffer || endTime <= startTime) return setStatus("حدد مقطع بالسحب على الموجة قبل النسخ");
    clipboardRef.current = sliceBuffer(songBuffer, startTime, endTime);
    setHasClipboard(true);
    setStatus(`تم نسخ ${fmtTime(endTime - startTime)}`);
  };
  const doCut = () => {
    if (!songBuffer || endTime <= startTime) return setStatus("حدد مقطع بالسحب على الموجة قبل القص");
    clipboardRef.current = sliceBuffer(songBuffer, startTime, endTime);
    setHasClipboard(true);
    pushHistory(songBuffer);
    const before = sliceBuffer(songBuffer, 0, startTime);
    const after = sliceBuffer(songBuffer, endTime, songBuffer.duration);
    const merged = concatBuffers([before, after]);
    setSongBuffer(merged);
    setPeaks(computePeaks(merged, 900));
    setEndTime(startTime);
    setStatus("تم القص — المقطع جاهز للصق بأي مكان");
  };
  const doDelete = () => {
    if (!songBuffer || endTime <= startTime) return setStatus("حدد مقطع بالسحب على الموجة قبل الحذف");
    pushHistory(songBuffer);
    const before = sliceBuffer(songBuffer, 0, startTime);
    const after = sliceBuffer(songBuffer, endTime, songBuffer.duration);
    const merged = concatBuffers([before, after]);
    setSongBuffer(merged);
    setPeaks(computePeaks(merged, 900));
    setEndTime(startTime);
    setStatus("تم حذف المقطع المحدد");
  };
  const doPaste = () => {
    if (!songBuffer || !clipboardRef.current) return setStatus("ما فيه مقطع منسوخ للصق");
    pushHistory(songBuffer);
    const before = sliceBuffer(songBuffer, 0, startTime);
    const selEnd = endTime > startTime ? endTime : startTime;
    const after = sliceBuffer(songBuffer, selEnd, songBuffer.duration);
    const merged = concatBuffers([before, clipboardRef.current, after]);
    setSongBuffer(merged);
    setPeaks(computePeaks(merged, 900));
    const point = startTime + clipboardRef.current.duration;
    setStartTime(point);
    setEndTime(point);
    setStatus("تم اللصق — حدد نطاق جديد للإيقاع لو تحتاج");
  };

  const buildRhythmBuffer = useCallback(async () => {
    if (!songBuffer) return null;
    const offsetSec = syncOffsetMs / 1000;
    if (rhythmMode === "custom") {
      const loop = myLoops[activeLoopIdx];
      if (!loop) {
        setStatus("ارفع لوب إيقاعي أو اختر نمطًا جاهزًا.");
        return null;
      }
      const buf = loopSyncEnabled
        ? getSyncedLoopBuffer(loop.buffer, rhythmBeatGrid, startTime, endTime, bpm, loopBeatsCount, preservePitch)
        : loop.buffer;
      return { buffer: buf, rStart: startTime + offsetSec, rEnd: endTime + offsetSec };
    }
    const pattern = PATTERNS.find((p) => p.id === patternId);
    if (rhythmBeatGrid.length > 2) {
      const locked = await buildGridLockedRhythm(pattern, rhythmBeatGrid, startTime, endTime, songBuffer.sampleRate, offsetSec, patternPhase);
      if (locked) return { buffer: locked, rStart: startTime, rEnd: endTime };
    }
    const phrase = await buildPhraseBuffer(pattern, bpm, songBuffer.sampleRate);
    return { buffer: phrase, rStart: startTime + offsetSec, rEnd: endTime + offsetSec };
  }, [songBuffer, rhythmMode, myLoops, activeLoopIdx, patternId, bpm, rhythmBeatGrid, startTime, endTime, syncOffsetMs, loopSyncEnabled, loopBeatsCount, preservePitch, patternPhase]);

  const stopPreview = () => {
    previewNodesRef.current.forEach((n) => {
      try { n.stop(); } catch (e) {}
    });
    previewNodesRef.current = [];
    setPreviewing(false);
    stopPlayhead();
  };
  const handlePreview = async () => {
    if (!songBuffer) return;
    stopPreview();
    setStatus("جارِ تجهيز المعاينة...");
    await new Promise((r) => setTimeout(r, 10));
    try {
      const rhy = await buildRhythmBuffer();
      if (!rhy) return setStatus("");
      const ctx = getCtx();
      const previewStart = Math.max(0, startTime - 2);
      const previewEnd = Math.min(songBuffer.duration, previewStart + 18);
      const mixBuf = buildMix(songBuffer, rhy.buffer, rhy.rStart, rhy.rEnd, songVol, rhythmVol, previewStart, previewEnd);
      limitClipping(mixBuf);

      const src = ctx.createBufferSource();
      src.buffer = mixBuf;
      src.connect(ctx.destination);
      src.start();
      previewNodesRef.current = [src];
      setPreviewing(true);
      setStatus("");
      startPlayhead(ctx, previewStart);
      src.onended = () => { setPreviewing(false); stopPlayhead(); };
    } catch (err) {
      setStatus("تعذّرت المعاينة: " + String(err.message || err));
    }
  };

  const handleRender = async () => {
    if (!songBuffer) return;
    stopPreview();
    setBusy(true);
    setDownloadUrl(null);
    setStatus("جارِ توليف الإيقاع...");
    try {
      const rhy = await buildRhythmBuffer();
      if (!rhy) { setBusy(false); return; }

      let workingSong = songBuffer;
      let rBuffer = rhy.buffer, rStart = rhy.rStart, rEnd = rhy.rEnd;

      if (introSec > 0) {
        setStatus(`جارِ بناء مقدمة إيقاع ${introSec} ثانية...`);
        workingSong = concatBuffers([silenceBuffer(songBuffer.sampleRate, songBuffer.numberOfChannels, introSec), songBuffer]);
        if (rhythmMode === "builtin" && rhythmBeatGrid.length > 2) {
          const pattern = PATTERNS.find((p) => p.id === patternId);
          const extGrid = extendGridBackward(rhythmBeatGrid, bpm, introSec);
          /* extendGridBackward يحط نبضات إضافية قبل بداية الجريد الحقيقي، فيتغيّر عدد النبضات
             اللي قبل أول نبضة حقيقية — وبما إن ترتيب دم/تك بالنمط (beatInBar) محسوب من رقم فهرس
             النبضة (i)، أي إزاحة بعدد النبضات المضافة تقلب ترتيب النمط كامل بجسم الأغنية (حتى لو
             التوقيت الزمني نفسه صحيح). نعوّض هالإزاحة بتصحيح الـ phase عشان النمط يطلع بنفس
             ترتيبه بالظبط اللي كان بيطلع لو صدّرت بدون مقدمة أصلًا */
          const addedBeats = extGrid.length - rhythmBeatGrid.length;
          const adjustedPhase = patternPhase - addedBeats;
          const introRhythm = await buildGridLockedRhythm(pattern, extGrid, -introSec, endTime, songBuffer.sampleRate, syncOffsetMs / 1000, adjustedPhase);
          if (introRhythm) { rBuffer = introRhythm; rStart = 0; rEnd = introSec + endTime; }
        } else {
          /* بدون جريد حقيقي (نمط ثابت أو لوب مخصص): buildMix يكرّر الإيقاع تلقائيًا طول أي نطاق تعطيه له،
             فعشان يغطي فترة المقدمة كمان لازم نخلي بداية التغطية من الصفر (تقريبًا) بدل ما نأخر بدايتها بمقدار المقدمة */
          rStart = syncOffsetMs / 1000;
          rEnd = introSec + rhy.rEnd;
        }
      }

      setStatus("جارِ دمج الإيقاع مع الأغنية الكاملة...");
      let mixed = buildMix(workingSong, rBuffer, rStart, rEnd, songVol, rhythmVol, 0, workingSong.duration);
      limitClipping(mixed);

      /* نمرّر التلميع وتغيير معدل العينات بـ OfflineAudioContext واحد بدل رندرين منفصلين متسلسلين:
         تسلسل رندرين كان ممكن يضيف انزياح ثابت بسيط (كسور ملي ثانية) بحدود كل رندر — إحساسه
         بالإيقاع واضح رغم إنه صغير رقميًا، وهذا بالضبط سبب "الملف كله منزاح" اللي يصير بالتصدير بس */
      const needResample = outputSR && mixed.sampleRate !== outputSR;
      if (masterBoost || needResample) {
        setStatus(masterBoost ? "جارِ تلميع وتقوية الصوت النهائي..." : `جارِ التحويل لمعدل ${outputSR / 1000}kHz...`);
        const targetRate = needResample ? outputSR : mixed.sampleRate;
        const newLength = needResample ? Math.ceil(mixed.duration * targetRate) : mixed.length;
        const offline = new OfflineAudioContext(mixed.numberOfChannels, newLength, targetRate);
        const src = offline.createBufferSource();
        src.buffer = mixed;
        let node = src;
        if (masterBoost) {
          const comp = offline.createDynamicsCompressor();
          comp.threshold.value = -10;
          comp.knee.value = 12;
          comp.ratio.value = 3;
          comp.attack.value = 0.003;
          comp.release.value = 0.25;
          node.connect(comp);
          node = comp;
        }
        node.connect(offline.destination);
        src.start(0);
        mixed = await offline.startRendering();
        limitClipping(mixed);
        if (masterBoost) mixed = normalizePeak(mixed, -1);
      }

      setStatus(outputFormat === "mp3" ? "جارِ تجهيز ملف MP3 للتحميل..." : "جارِ تجهيز ملف WAV للتحميل...");
      const base = songName.replace(/\.[^/.]+$/, "") || "الأغنية";
      let blob, ext;
      if (outputFormat === "mp3") {
        blob = audioBufferToMp3(mixed, mp3Kbps);
        ext = "mp3";
      } else {
        const bitDepth = outputQuality === "high" ? 24 : 16;
        blob = audioBufferToWav(mixed, bitDepth);
        ext = "wav";
      }
      const url = URL.createObjectURL(blob);
      setDownloadUrl(url);
      setDownloadName(`${base} - Tiger Event Mix.${ext}`);
      setStatus("جاهز! اضغط تحميل الميكس.");
    } catch (err) {
      setStatus("صار خطأ أثناء المعالجة: " + String(err.message || err));
    } finally {
      setBusy(false);
    }
  };

  const handlePreviewFull = async () => {
    if (!songBuffer) return;
    stopPreview();
    setStatus("جارِ تجهيز معاينة المقطع كامل...");
    await new Promise((r) => setTimeout(r, 10));
    try {
      const rhy = await buildRhythmBuffer();
      if (!rhy) return setStatus("");
      const ctx = getCtx();
      const winStart = Math.max(0, startTime - 1);
      const winEnd = Math.min(songBuffer.duration, endTime + 1);
      const mixBuf = buildMix(songBuffer, rhy.buffer, rhy.rStart, rhy.rEnd, songVol, rhythmVol, winStart, winEnd);
      limitClipping(mixBuf);
      const src = ctx.createBufferSource();
      src.buffer = mixBuf;
      src.connect(ctx.destination);
      src.start();
      previewNodesRef.current = [src];
      setPreviewing(true);
      setStatus("");
      startPlayhead(ctx, winStart);
      src.onended = () => { setPreviewing(false); stopPlayhead(); };
    } catch (err) {
      setStatus("تعذّرت المعاينة: " + String(err.message || err));
    }
  };

  const handleBatchExport = async () => {
    if (songFiles.length < 2) return;
    setBatchBusy(true);
    try {
      const ctx = getCtx();
      for (let i = 0; i < songFiles.length; i++) {
        const f = songFiles[i];
        setBatchStatus(`(${i + 1}/${songFiles.length}) تحليل ${f.name}...`);
        await new Promise((r) => setTimeout(r, 10));
        const { bpm: dBpm, beatGrid: grid } = await analyzeRhythm(f.buffer);
        const dDrop = detectDrop(f.buffer);
        const sStart = Math.min(dDrop, f.buffer.duration - 0.5);
        const sEnd = f.buffer.duration;

        let rhythmBuffer;
        let rStart = sStart, rEnd = sEnd;
        const offsetSec = syncOffsetMs / 1000;
        if (rhythmMode === "custom") {
          const loop = myLoops[activeLoopIdx];
          rhythmBuffer = loop ? (loopSyncEnabled ? getSyncedLoopBuffer(loop.buffer, grid, sStart, sEnd, dBpm, loopBeatsCount, preservePitch) : loop.buffer) : null;
          rStart = sStart + offsetSec;
          rEnd = sEnd + offsetSec;
        } else {
          const pattern = PATTERNS.find((p) => p.id === patternId);
          if (grid.length > 2) {
            rhythmBuffer = await buildGridLockedRhythm(pattern, grid, sStart, sEnd, f.buffer.sampleRate, offsetSec, patternPhase);
          } else {
            rhythmBuffer = await buildPhraseBuffer(pattern, dBpm, f.buffer.sampleRate);
            rStart = sStart + offsetSec;
            rEnd = sEnd + offsetSec;
          }
        }
        if (!rhythmBuffer) continue;

        setBatchStatus(`(${i + 1}/${songFiles.length}) دمج ${f.name}...`);
        let mixed = buildMix(f.buffer, rhythmBuffer, rStart, rEnd, songVol, rhythmVol, 0, f.buffer.duration);
        limitClipping(mixed);
        {
          const needResample = outputSR && mixed.sampleRate !== outputSR;
          if (masterBoost || needResample) {
            const targetRate = needResample ? outputSR : mixed.sampleRate;
            const newLength = needResample ? Math.ceil(mixed.duration * targetRate) : mixed.length;
            const offline = new OfflineAudioContext(mixed.numberOfChannels, newLength, targetRate);
            const src = offline.createBufferSource();
            src.buffer = mixed;
            let node = src;
            if (masterBoost) {
              const comp = offline.createDynamicsCompressor();
              comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.25;
              node.connect(comp);
              node = comp;
            }
            node.connect(offline.destination);
            src.start(0);
            mixed = await offline.startRendering();
            limitClipping(mixed);
            if (masterBoost) mixed = normalizePeak(mixed, -1);
          }
        }
        const bitDepth = outputQuality === "high" ? 24 : 16;
        const blob = audioBufferToWav(mixed, bitDepth);
        const url = URL.createObjectURL(blob);
        const base = f.name.replace(/\.[^/.]+$/, "") || `song-${i + 1}`;
        const a = document.createElement("a");
        a.href = url;
        a.download = `${base} - Tiger Event Mix.wav`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        await new Promise((r) => setTimeout(r, 400));
      }
      setBatchStatus("✅ خلصت معالجة كل الملفات");
    } catch (err) {
      setBatchStatus("صار خطأ بالمعالجة الجماعية: " + String(err.message || err));
    } finally {
      setBatchBusy(false);
    }
  };

  const canWork = !!songBuffer;
  const beatPulseMs = 60000 / bpm;
  const filteredPatterns = PATTERNS.filter((p) => p.category === category);

  return (
    <div style={styles.page} className="app-page" dir={dir}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap');
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        input[type="range"] { -webkit-appearance: none; height: 4px; border-radius: 4px; background: ${COLORS.line}; }
        input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
          background: ${COLORS.gold}; cursor: pointer; border: 2px solid ${COLORS.bg};
        }
        @keyframes pulseRing { 0% { transform: scale(0.85); opacity: 0.9; } 60% { transform: scale(1.5); opacity: 0; } 100% { opacity: 0; } }
        button { cursor: pointer; font-family: 'Cairo', sans-serif; }
        button:disabled { cursor: not-allowed; opacity: 0.4; }
        @media (min-width: 900px) {
          :root { --card-max: 860px; --subtitle-max: 680px; }
          .app-title { font-size: 40px !important; }
          .app-page { padding-top: 48px !important; }
        }
        @media (min-width: 1300px) {
          :root { --card-max: 1080px; --subtitle-max: 760px; }
        }
      `}</style>

      <div style={{ display: "flex", justifyContent: "flex-end", maxWidth: "var(--card-max, 640px)", margin: "0 auto" }}>
        <button
          onClick={() => setLang((l) => (l === "ar" ? "en" : "ar"))}
          style={{ background: COLORS.panel2, color: COLORS.goldSoft, border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 700 }}
        >
          {lang === "ar" ? "English" : "العربية"}
        </button>
      </div>
      <div style={styles.header}>
        <img src={LOGO_DATA_URI} alt="Tiger Event" style={styles.logoImg} />

                            setRhythmBeatGrid(g);
                            setBpm(averageGridBpm(g) || Math.min(180, Math.round(bpm * 2)));
                            setStatus(L("تم تصحيح جريد الإيقاع: ضاعفنا عدد النبضات — جريد الأغنية ما تغيّر"));
                          } else {
                            setBpm((b) => Math.min(180, Math.round(b * 2)));
                          }
                        }}
                        title={L("ضاعف كثافة نبضات الإيقاع فقط — جريد الأغنية يضل زي ما هو")}
                      >
                        ×2
                      </button>
                    </div>
                    <div style={styles.knownBpmRow}>
                      <input
                        type="number" className="mono" style={{ ...styles.numInput, width: 70 }}
                        value={bpm}
                        onChange={(e) => setBpm(Math.max(40, Math.min(220, Number(e.target.value) || 0)))}
                      />
                      <button type="button" onClick={handleAnalyzeWithKnownBpm} style={styles.knownBpmBtn}>
                        {L("🎯 ابحث عن جريد الأغنية بهذا الـBPM")}
                      </button>
                    </div>
                    <div style={styles.hint}>{L("لو الكشف التلقائي غلط، اكتب السرعة الصحيحة اللي تعرفها (أو دقّها بزر \"دق\") واضغط الزر — يبني الجريد على أساسها مباشرة بدون تخمين")}</div>
                  </>
                )}
              </div>
            </div>
          </div>

        <div style={styles.sliderBlock}>
          <div style={styles.sliderLabel}><span>{L("صوت الأغنية الأصلية")}</span><span className="mono">{Math.round(songVol * 100)}٪</span></div>
          <input type="range" min={0} max={2} step={0.01} value={songVol} onChange={(e) => setSongVol(Number(e.target.value))} style={{ width: "100%" }} />
        </div>
        <div style={styles.sliderBlock}>
          <div style={styles.sliderLabel}><span>{L("صوت الإيقاع المُضاف")}</span><span className="mono">{Math.round(rhythmVol * 100)}٪</span></div>
          <input type="range" min={0} max={2} step={0.01} value={rhythmVol} onChange={(e) => setRhythmVol(Number(e.target.value))} style={{ width: "100%" }} />
        </div>
        <div style={styles.numField}>
          <label style={styles.numLabel}>{L("مقدمة إيقاع قبل الأغنية (ثانية) — إيقاع بس بدون الأغنية، يمشي مع نفس السرعة والجريد")}</label>
          <input
            type="number" min={0} max={60} step={1} className="mono"
            value={introSec}
            onChange={(e) => setIntroSec(Math.max(0, Number(e.target.value) || 0))}
            style={styles.numInput}
          />
        </div>
      </section>

      <section style={{ ...styles.card, ...(canWork ? {} : styles.disabled) }}>
        <div style={styles.stepRow}><span style={styles.stepNum}>05</span><span style={styles.stepTitle}>{L("جودة الإخراج")}</span></div>

        <div style={styles.hint}>{L("صيغة الملف")}</div>
        <div style={styles.toggleRow}>
          <button onClick={() => setOutputFormat("wav")} style={outputFormat === "wav" ? styles.toggleActive : styles.toggle}>{L("WAV (جودة كاملة، حجم أكبر)")}</button>
          <button onClick={() => setOutputFormat("mp3")} style={outputFormat === "mp3" ? styles.toggleActive : styles.toggle}>{L("MP3 (حجم أصغر، مناسب للمشاركة)")}</button>
        </div>

        {outputFormat === "mp3" && (
          <div style={{ marginTop: 10 }}>
            <div style={styles.hint}>{L("جودة MP3 (kbps)")}</div>
            <div style={styles.toggleRow}>
              <button onClick={() => setMp3Kbps(128)} style={mp3Kbps === 128 ? styles.toggleActive : styles.toggle}>128</button>
              <button onClick={() => setMp3Kbps(192)} style={mp3Kbps === 192 ? styles.toggleActive : styles.toggle}>192</button>
              <button onClick={() => setMp3Kbps(320)} style={mp3Kbps === 320 ? styles.toggleActive : styles.toggle}>320</button>
            </div>
          </div>
        )}

        <div style={{ ...styles.hint, marginTop: 14 }}>{L("معدل العينة (Sample Rate)")}</div>
        <div style={styles.toggleRow}>
          <button onClick={() => setOutputSR(0)} style={outputSR === 0 ? styles.toggleActive : styles.toggle}>{L("أصلي (بدون تحويل)")}</button>
          <button onClick={() => setOutputSR(44100)} style={outputSR === 44100 ? styles.toggleActive : styles.toggle}>44.1kHz</button>
          <button onClick={() => setOutputSR(48000)} style={outputSR === 48000 ? styles.toggleActive : styles.toggle}>48kHz</button>
        </div>

        {outputFormat === "wav" && (
          <>
            <div style={{ ...styles.hint, marginTop: 14 }}>{L("عمق البت (Bit Depth)")}</div>
            <div style={styles.toggleRow}>
              <button onClick={() => setOutputQuality("standard")} style={outputQuality === "standard" ? styles.toggleActive : styles.toggle}>16-bit</button>
              <button onClick={() => setOutputQuality("high")} style={outputQuality === "high" ? styles.toggleActive : styles.toggle}>24-bit</button>
            </div>
          </>
        )}

        <label style={styles.checkRow}>
          <input type="checkbox" checked={masterBoost} onChange={(e) => setMasterBoost(e.target.checked)} />
          {L("تلميع وتقوية الصوت النهائي (كومبريسور + تطبيع المستوى)")}
        </label>
      </section>

      <section style={{ ...styles.card, ...(canWork ? {} : styles.disabled) }}>
        <div style={styles.stepRow}><span style={styles.stepNum}>06</span><span style={styles.stepTitle}>{L("معاينة وتصدير")}</span></div>
        <div style={styles.actionRow}>
          <button onClick={previewing ? stopPreview : handlePreview} style={styles.secondaryBtn} disabled={busy}>
            {previewing ? L("إيقاف المعاينة") : L("▶ معاينة سريعة (18 ثانية)")}
          </button>
          <button onClick={previewing ? stopPreview : handlePreviewFull} style={styles.secondaryBtn} disabled={busy}>
            {previewing ? L("إيقاف المعاينة") : L("▶ معاينة المقطع كامل")}
          </button>
          <button onClick={handleRender} style={styles.primaryBtn} disabled={busy}>
            {busy ? L("جارِ المعالجة...") : L("تصدير وتحميل الميكس")}
          </button>
        </div>
        {status && <div style={styles.status}>{status}</div>}
        {downloadUrl && <a href={downloadUrl} download={downloadName} style={styles.downloadBtn}>⬇ {L("تحميل")} {downloadName}</a>}

        {songFiles.length > 1 && (
          <>
            <div style={styles.hint}>{L("معالجة جماعية: يطبّق نفس النمط والإعدادات الحالية على كل الملفات المرفوعة، ويحلل تنبو وسرعة كل واحد لحاله تلقائيًا")}</div>
            <button onClick={handleBatchExport} style={styles.batchBtn} disabled={batchBusy}>
              {batchBusy ? L("جارِ معالجة الكل...") : `⬇ ${L("تصدير كل الملفات")} (${songFiles.length})`}
            </button>
            {batchStatus && <div style={styles.status}>{batchStatus}</div>}
          </>
        )}
      </section>

      <div style={styles.footer}>{L("Tiger Event — يشتغل كامل داخل المتصفح، الملف ما يترفع لأي سيرفر")}</div>
    </div>
  );
}
