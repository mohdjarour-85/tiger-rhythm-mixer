/* ---------- توليف الإيقاعات (Percussion Synthesis) ---------- */
function noiseBuffer(ctx, duration) {
  const sr = ctx.sampleRate;
  const len = Math.max(1, Math.floor(sr * duration));
  const buf = ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}
/* دم — نغمة الدربكة العميقة + طبقة احتكاك جلد خفيفة عند الضربة */
function hitDum(ctx, t) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(160, t);
  osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(1.0, t + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.36);

  const skinSrc = ctx.createBufferSource();
  skinSrc.buffer = noiseBuffer(ctx, 0.03);
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 220;
  bp.Q.value = 1.5;

/* ---------- دمج مباشر بالعينات: أوثق من جدولة تشغيل (loop/duration) عبر AudioContext ---------- */
function buildMix(songBuffer, rhythmBuffer, rhythmStart, rhythmEnd, songVol, rhythmVol, windowStart, windowEnd) {
  const sr = songBuffer.sampleRate;
  const wStart = Math.max(0, Math.round(windowStart * sr));
  const wEnd = Math.min(songBuffer.length, Math.round(windowEnd * sr));
  const len = Math.max(1, wEnd - wStart);
  const numChannels = Math.max(songBuffer.numberOfChannels, rhythmBuffer ? rhythmBuffer.numberOfChannels : 1, 1);
  const out = new AudioBuffer({ length: len, numberOfChannels: numChannels, sampleRate: sr });
  const rStart = Math.round(rhythmStart * sr);
  const rEnd = Math.round(rhythmEnd * sr);
  const rLen = rhythmBuffer ? rhythmBuffer.length : 0;
  for (let ch = 0; ch < numChannels; ch++) {
    const songCh = ch < songBuffer.numberOfChannels ? songBuffer.getChannelData(ch) : songBuffer.getChannelData(0);
    const rhyCh = rhythmBuffer ? (ch < rhythmBuffer.numberOfChannels ? rhythmBuffer.getChannelData(ch) : rhythmBuffer.getChannelData(0)) : null;
    const dst = out.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const g = wStart + i;
      let v = (g < songBuffer.length ? songCh[g] : 0) * songVol;
      if (rhyCh && rLen > 0 && g >= rStart && g < rEnd) {
        v += rhyCh[(g - rStart) % rLen] * rhythmVol;
      }
      dst[i] = v;
    }
  }
  return out;
}

/* ---------- تصدير WAV (16 أو 24 بت) ---------- */
function audioBufferToWav(buffer, bitDepth) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const bytesPerSample = bitDepth === 24 ? 3 : 2;
  const blockAlign = numChannels * bytesPerSample;
  const dataSize = numFrames * blockAlign;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);
  const writeStr = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeStr(36, "data");
  view.setUint32(40, dataSize, true);

  const channels = [];
  for (let ch = 0; ch < numChannels; ch++) channels.push(buffer.getChannelData(ch));
  let offset = 44;
  for (let i = 0; i < numFrames; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const s = Math.max(-1, Math.min(1, channels[ch][i]));
      if (bitDepth === 24) {
        const iv = Math.round(s < 0 ? s * 0x800000 : s * 0x7fffff);
        view.setUint8(offset, iv & 0xff);
        view.setUint8(offset + 1, (iv >> 8) & 0xff);
        view.setUint8(offset + 2, (iv >> 16) & 0xff);
        offset += 3;
      } else {
        const iv = s < 0 ? s * 0x8000 : s * 0x7fff;
        view.setInt16(offset, iv, true);
        offset += 2;
      }
    }
  }
  return new Blob([ab], { type: "audio/wav" });
}

/* ---------- أدوات مساعدة ---------- */
function fmtTime(s) {
  if (!isFinite(s)) return "٠:٠٠";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, "0")}`;
}
function computePeaks(buffer, bins) {
  const data = buffer.getChannelData(0);
  const per = Math.max(1, Math.floor(data.length / bins));
  const peaks = new Float32Array(bins);
  for (let i = 0; i < bins; i++) {
    let max = 0;
    const start = i * per;
    for (let j = 0; j < per; j++) {
      const v = Math.abs(data[start + j] || 0);
      if (v > max) max = v;
    }
    peaks[i] = max;
  }
  return peaks;
}

/* ================= المكون الرئيسي ================= */
function App() {
  const audioCtxRef = useRef(null);
  const canvasRef = useRef(null);
  const rhythmCanvasRef = useRef(null);
  const overlayCanvasRef = useRef(null);
  const containerRef = useRef(null);
  const scrollRef = useRef(null);
  const historyRef = useRef([]);
  const clipboardRef = useRef(null);
  const previewNodesRef = useRef([]);
  const tapTimesRef = useRef([]);
  const rafRef = useRef(null);
  const autoFollowRef = useRef(true);
  const playStartRef = useRef({ ctxTime: 0, windowStart: 0 });

  const [songBuffer, setSongBuffer] = useState(null);
  const [songName, setSongName] = useState("");
  const [peaks, setPeaks] = useState(null);
  const [loadingSong, setLoadingSong] = useState(false);
  const [historyLen, setHistoryLen] = useState(0);
  const [hasClipboard, setHasClipboard] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [autoFollow, setAutoFollow] = useState(true);
  const [songFiles, setSongFiles] = useState([]);
  const [activeSongIdx, setActiveSongIdx] = useState(-1);
  const [batchBusy, setBatchBusy] = useState(false);
  const [batchStatus, setBatchStatus] = useState("");

  const [category, setCategory] = useState("مصري");
  const [rhythmMode, setRhythmMode] = useState("builtin");
  const [patternId, setPatternId] = useState("maqsoum");
  const [myLoops, setMyLoops] = useState([]);
  const [activeLoopIdx, setActiveLoopIdx] = useState(0);
  const [loopBeatsCount, setLoopBeatsCount] = useState(4);
  const [loopSyncEnabled, setLoopSyncEnabled] = useState(true);

  const [bpm, setBpm] = useState(120);
  const [startTime, setStartTime] = useState(0);
  const [endTime, setEndTime] = useState(0);
  const [dragging, setDragging] = useState(null);
  const [beatGrid, setBeatGrid] = useState([]);
  const [snapToGrid, setSnapToGrid] = useState(true);
  const [syncOffsetMs, setSyncOffsetMs] = useState(0);

  const [songVol, setSongVol] = useState(1);
  const [rhythmVol, setRhythmVol] = useState(0.85);

  const [outputQuality, setOutputQuality] = useState("high");
  const [outputSR, setOutputSR] = useState(48000);
  const [masterBoost, setMasterBoost] = useState(true);

  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [previewing, setPreviewing] = useState(false);
  const [downloadUrl, setDownloadUrl] = useState(null);
  const [downloadName, setDownloadName] = useState("");

  const getCtx = useCallback(() => {
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
    return audioCtxRef.current;
  }, []);

  const startPlayhead = (ctx, windowStart) => {
    playStartRef.current = { ctxTime: ctx.currentTime, windowStart };
    const tick = () => {
      const elapsed = ctx.currentTime - playStartRef.current.ctxTime;
      const t = playStartRef.current.windowStart + elapsed;
      drawPlayhead(t);
      autoScrollTo(t);
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
  };
  const stopPlayhead = () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
    drawPlayhead(null);
  };
  const drawPlayhead = (t) => {
    const canvas = overlayCanvasRef.current;
    if (!canvas || !songBuffer) return;
    const dpr = window.devicePixelRatio || 1;
    const g = canvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, canvas.width, canvas.height);
    if (t == null) return;
    g.scale(dpr, dpr);
    const width = canvas.width / dpr;
    const height = canvas.height / dpr;
    const x = (t / songBuffer.duration) * width;
    g.strokeStyle = "#FFFFFF";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x, 0);
    g.lineTo(x, height);
    g.stroke();
  };
  const autoScrollTo = (t) => {
    const scroller = scrollRef.current;
    if (!scroller || !songBuffer || !autoFollowRef.current) return;
    const width = scroller.scrollWidth;
    if (!width) return;
    const x = (t / songBuffer.duration) * width;
    const viewW = scroller.clientWidth;
    if (viewW >= width) return;
    const target = Math.max(0, Math.min(width - viewW, x - viewW / 2));
    scroller.scrollLeft = target;
  };

  const pushHistory = (buf) => {
    historyRef.current.push(buf);
    if (historyRef.current.length > 12) historyRef.current.shift();
    setHistoryLen(historyRef.current.length);
  };
  const undo = () => {
    const prev = historyRef.current.pop();
    setHistoryLen(historyRef.current.length);
    if (prev) {
      setSongBuffer(prev);
      setPeaks(computePeaks(prev, 900));
      setStartTime((t) => Math.min(t, prev.duration));
      setEndTime((t) => Math.min(t, prev.duration));
      setStatus("تم التراجع عن آخر تعديل");
    }
  };

  const loadSongIntoState = (buf, name) => {
    setSongBuffer(buf);
    setSongName(name);
    setPeaks(computePeaks(buf, 900));
    setStartTime(0);
    setEndTime(buf.duration);
    setBeatGrid([]);
    setZoom(1);
    setDownloadUrl(null);
    setStatus("");
    historyRef.current = [];
    setHistoryLen(0);
    clipboardRef.current = null;
    setHasClipboard(false);
  };

  const handleSongFile = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setLoadingSong(true);
    try {
      const ctx = getCtx();
      const added = [];
      for (const file of files) {
        try {
          const arr = await file.arrayBuffer();
          const buf = await ctx.decodeAudioData(arr);
          added.push({ name: file.name, buffer: buf });
        } catch (err) {}
      }
      if (!added.length) {
        setStatus("تعذّرت قراءة الملفات. جرّب mp3 أو wav.");
        return;
      }
      setSongFiles((prev) => {
        const merged = [...prev, ...added];
        return merged;
      });
      const first = added[0];
      setActiveSongIdx(songFiles.length);
      loadSongIntoState(first.buffer, first.name);
    } finally {
      setLoadingSong(false);
    }
  };

  const switchToSong = (idx) => {
    const f = songFiles[idx];
    if (!f) return;
    setActiveSongIdx(idx);
    loadSongIntoState(f.buffer, f.name);
  };

  const handleAutoAnalyze = async () => {
    if (!songBuffer) return;
    setStatus("جارِ تحليل الأغنية (خوارزمية محسّنة: نطاقات ترددية + برمجة ديناميكية)...");
    await new Promise((r) => setTimeout(r, 30));
    try {
      const { bpm: detectedBpm, beatGrid: grid } = await analyzeRhythm(songBuffer);
      const dropAt = detectDrop(songBuffer);
      const snappedStart = nearestBeat(grid, Math.min(dropAt, songBuffer.duration - 0.5));
      setBpm(detectedBpm);
      setBeatGrid(grid);
      setSnapToGrid(true);
      setStartTime(snappedStart);
      setEndTime(songBuffer.duration);
      setStatus(`رصدنا ${detectedBpm} BPM وجريد ${grid.length} نبضة — نقطة التنبو محاذاة على أقرب ضربة عند ${fmtTime(snappedStart)}`);
    } catch (err) {
      setStatus("تعذّر التحليل التلقائي: " + String(err.message || err));
    }
  };

  const handleLoopFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const ctx = getCtx();
    const added = [];
    for (const file of files) {
      try {
        const arr = await file.arrayBuffer();
        const buf = await ctx.decodeAudioData(arr);
        added.push({ name: file.name, buffer: buf });
      } catch (err) {}
    }
    if (added.length) {
      setMyLoops((prev) => {
        const merged = [...prev, ...added];
        setActiveLoopIdx(merged.length - added.length);
        return merged;
      });
    }
  };

  useEffect(() => {
    if (!songBuffer) return;
    const canvas = canvasRef.current;
    const container = containerRef.current;
    if (!canvas || !container) return;
    const baseWidth = container.clientWidth;
    const width = Math.max(baseWidth, baseWidth * zoom);
    const height = 220;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    const g = canvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.scale(dpr, dpr);
    g.clearRect(0, 0, width, height);

    const duration = songBuffer.duration;
    const bins = Math.min(20000, Math.max(900, Math.round(900 * zoom)));
    const displayPeaks = computePeaks(songBuffer, bins);
    const startX = (startTime / duration) * width;
    const endX = (endTime / duration) * width;

    g.fillStyle = "rgba(201,162,39,0.10)";
    g.fillRect(startX, 0, Math.max(0, endX - startX), height);

    const mid = height / 2;
    const barW = width / displayPeaks.length;
    for (let i = 0; i < displayPeaks.length; i++) {
      const x = i * barW;
      const inRhythm = x >= startX && x <= endX;
      const h = Math.max(1.5, displayPeaks[i] * (mid - 6));
      g.fillStyle = inRhythm ? COLORS.goldSoft : "rgba(244,238,224,0.35)";
      g.fillRect(x, mid - h, Math.max(1, barW - 1), h * 2);
    }

    g.strokeStyle = COLORS.line;
    g.beginPath();
    g.moveTo(0, mid);
    g.lineTo(width, mid);
    g.stroke();

    if (beatGrid.length > 0) {
      g.strokeStyle = "rgba(255,255,255,0.28)";
      g.lineWidth = 1;
      for (const bt of beatGrid) {
        const bx = (bt / duration) * width;
        if (bx < 0 || bx > width) continue;
        g.beginPath();
        g.moveTo(bx, 0);
        g.lineTo(bx, height);
        g.stroke();
      }
    }

    g.fillStyle = COLORS.gold;
    g.beginPath();
    g.moveTo(startX - 7, 0);
    g.lineTo(startX + 7, 0);
    g.lineTo(startX, 12);
    g.closePath();
    g.fill();
    g.fillRect(startX - 1.2, 0, 2.4, height);

    g.fillStyle = COLORS.coral;
    g.beginPath();
    g.moveTo(endX - 7, height);
    g.lineTo(endX + 7, height);
    g.lineTo(endX, height - 12);
    g.closePath();
    g.fill();
    g.fillRect(endX - 1.2, 0, 2.4, height);

    const overlay = overlayCanvasRef.current;
    if (overlay) {
      overlay.width = width * dpr;
      overlay.height = height * dpr;
      overlay.style.width = width + "px";
      overlay.style.height = height + "px";
    }
  }, [songBuffer, startTime, endTime, beatGrid, zoom]);

  useEffect(() => {
    if (!songBuffer) return;
    const scroller = scrollRef.current;
    if (!scroller) return;
    const t = requestAnimationFrame(() => {
      const width = scroller.scrollWidth;
      const viewW = scroller.clientWidth;
      if (!width || viewW >= width) return;
      const x = (startTime / songBuffer.duration) * width;
      scroller.scrollLeft = Math.max(0, Math.min(width - viewW, x - viewW / 2));
    });
    return () => cancelAnimationFrame(t);
    // eslint-disable-next-line
  }, [zoom]);

  useEffect(() => {
    if (!songBuffer) return;
    const canvas = rhythmCanvasRef.current;
    const container = containerRef.current;
    if (!canvas || !container) return;
    const baseWidth = container.clientWidth;
    const width = Math.max(baseWidth, baseWidth * zoom);
    const height = 64;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    const g = canvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.scale(dpr, dpr);
    g.clearRect(0, 0, width, height);
    g.fillStyle = "#0D0620";
    g.fillRect(0, 0, width, height);

    const duration = songBuffer.duration;
    const offsetSec = syncOffsetMs / 1000;
    if (rhythmMode === "builtin") {
      const pattern = PATTERNS.find((p) => p.id === patternId);
      const hits = computeHitList(pattern, beatGrid, startTime, endTime, bpm, offsetSec);
      for (const h of hits) {
        const x = (h.time / duration) * width;
        g.fillStyle = HIT_COLORS[h.type] || "#fff";
        const r = h.type === "dum" ? 6 : 4;
        g.beginPath();
        g.arc(x, height / 2, r, 0, Math.PI * 2);
        g.fill();
      }
    } else {
      const loop = myLoops[activeLoopIdx];
      if (loop && loop.buffer) {
        const activeBuf = loopSyncEnabled ? getSyncedLoopBuffer(loop.buffer, beatGrid, startTime, endTime, bpm, loopBeatsCount) : loop.buffer;
        const rStart = startTime + offsetSec;
        const rEnd = endTime + offsetSec;
        const rLen = activeBuf.length;
        const sr = activeBuf.sampleRate;
        const loopPeaks = computePeaks(activeBuf, Math.max(60, Math.round(200 * (activeBuf.duration || 1))));
        const startX = (rStart / duration) * width;
        const endX = (rEnd / duration) * width;
        g.fillStyle = "rgba(226,96,79,0.08)";
        g.fillRect(startX, 0, Math.max(0, endX - startX), height);
        const stepSec = 0.02;
        for (let t = Math.max(0, rStart); t < Math.min(duration, rEnd); t += stepSec) {
          const phase = ((t - rStart) * sr) % rLen;
          const bin = Math.min(loopPeaks.length - 1, Math.floor((phase / rLen) * loopPeaks.length));
          const amp = loopPeaks[bin];
          const x = (t / duration) * width;
          const h = Math.max(1, amp * (height / 2 - 4));
          g.fillStyle = COLORS.coral;
          g.fillRect(x, height / 2 - h, 1.5, h * 2);
        }
        g.strokeStyle = "rgba(255,255,255,0.5)";
        g.lineWidth = 1;
        const loopDur = activeBuf.duration;
        for (let t = rStart; t < rEnd; t += loopDur) {
          const x = (t / duration) * width;
          g.beginPath();
          g.moveTo(x, 0);
          g.lineTo(x, height);
          g.stroke();
        }
      } else {
        g.fillStyle = COLORS.muted;
        g.font = "12px Cairo";
        g.textAlign = "center";
        g.fillText("ارفع لوب من قسم \"لوباتي الخاصة\" حتى يظهر هنا", width / 2, height / 2 + 4);
      }
    }
  }, [songBuffer, startTime, endTime, beatGrid, zoom, rhythmMode, patternId, bpm, myLoops, activeLoopIdx, syncOffsetMs, loopSyncEnabled, loopBeatsCount]);

  const timeFromEvent = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const x = Math.min(Math.max(clientX - rect.left, 0), rect.width);
    return (x / rect.width) * songBuffer.duration;
  };
  const onPointerDown = (e) => {
    if (!songBuffer) return;
    const t = timeFromEvent(e);
    setDragging(Math.abs(t - startTime) <= Math.abs(t - endTime) ? "start" : "end");
  };
  const onPointerMove = (e) => {
    if (!dragging || !songBuffer) return;
    let t = timeFromEvent(e);
    if (snapToGrid && beatGrid.length > 0) t = nearestBeat(beatGrid, t);
    if (dragging === "start") setStartTime(Math.min(t, endTime));
    else setEndTime(Math.max(t, startTime + 0.05));
  };
  const onPointerUp = () => setDragging(null);

  const handleTap = () => {
    const now = performance.now();
    const arr = tapTimesRef.current.filter((t) => now - t < 2200);
    arr.push(now);
    tapTimesRef.current = arr;
    if (arr.length >= 2) {
      const intervals = [];
      for (let i = 1; i < arr.length; i++) intervals.push(arr[i] - arr[i - 1]);
      const avg = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      const newBpm = Math.round(60000 / avg);
      if (newBpm >= 40 && newBpm <= 220) setBpm(newBpm);
    }
  };

  const doCopy = () => {
    if (!songBuffer || endTime <= startTime) return setStatus("حدد مقطع بالسحب على الموجة قبل النسخ");
    clipboardRef.current = sliceBuffer(songBuffer, startTime, endTime);
    setHasClipboard(true);
    setStatus(`تم نسخ ${fmtTime(endTime - startTime)}`);
  };
  const doCut = () => {
    if (!songBuffer || endTime <= startTime) return setStatus("حدد مقطع بالسحب على الموجة قبل القص");
    clipboardRef.current = sliceBuffer(songBuffer, startTime, endTime);
    setHasClipboard(true);
    pushHistory(songBuffer);
    const before = sliceBuffer(songBuffer, 0, startTime);
    const after = sliceBuffer(songBuffer, endTime, songBuffer.duration);
    const merged = concatBuffers([before, after]);
    setSongBuffer(merged);
    setPeaks(computePeaks(merged, 900));
    setEndTime(startTime);
    setStatus("تم القص — المقطع جاهز للصق بأي مكان");
  };
  const doDelete = () => {
    if (!songBuffer || endTime <= startTime) return setStatus("حدد مقطع بالسحب على الموجة قبل الحذف");
    pushHistory(songBuffer);
    const before = sliceBuffer(songBuffer, 0, startTime);
    const after = sliceBuffer(songBuffer, endTime, songBuffer.duration);
    const merged = concatBuffers([before, after]);
    setSongBuffer(merged);
    setPeaks(computePeaks(merged, 900));
    setEndTime(startTime);
    setStatus("تم حذف المقطع المحدد");
  };
  const doPaste = () => {
    if (!songBuffer || !clipboardRef.current) return setStatus("ما فيه مقطع منسوخ للصق");
    pushHistory(songBuffer);
    const before = sliceBuffer(songBuffer, 0, startTime);
    const selEnd = endTime > startTime ? endTime : startTime;
    const after = sliceBuffer(songBuffer, selEnd, songBuffer.duration);
    const merged = concatBuffers([before, clipboardRef.current, after]);
    setSongBuffer(merged);
    setPeaks(computePeaks(merged, 900));
    const point = startTime + clipboardRef.current.duration;
    setStartTime(point);
    setEndTime(point);
    setStatus("تم اللصق — حدد نطاق جديد للإيقاع لو تحتاج");
  };

  const buildRhythmBuffer = useCallback(async () => {
    if (!songBuffer) return null;
    const offsetSec = syncOffsetMs / 1000;
    if (rhythmMode === "custom") {
      const loop = myLoops[activeLoopIdx];
      if (!loop) {
        setStatus("ارفع لوب إيقاعي أو اختر نمطًا جاهزًا.");
        return null;
      }
      const buf = loopSyncEnabled
        ? getSyncedLoopBuffer(loop.buffer, beatGrid, startTime, endTime, bpm, loopBeatsCount)
        : loop.buffer;
      return { buffer: buf, rStart: startTime + offsetSec, rEnd: endTime + offsetSec };
    }
    const pattern = PATTERNS.find((p) => p.id === patternId);
    if (beatGrid.length > 2) {
      const locked = await buildGridLockedRhythm(pattern, beatGrid, startTime, endTime, songBuffer.sampleRate, offsetSec);
      if (locked) return { buffer: locked, rStart: startTime, rEnd: endTime };
    }
    const phrase = await buildPhraseBuffer(pattern, bpm, songBuffer.sampleRate);
    return { buffer: phrase, rStart: startTime + offsetSec, rEnd: endTime + offsetSec };
  }, [songBuffer, rhythmMode, myLoops, activeLoopIdx, patternId, bpm, beatGrid, startTime, endTime, syncOffsetMs, loopSyncEnabled, loopBeatsCount]);

  const stopPreview = () => {
    previewNodesRef.current.forEach((n) => {
      try { n.stop(); } catch (e) {}
    });
    previewNodesRef.current = [];
    setPreviewing(false);
    stopPlayhead();
  };
  const handlePreview = async () => {
    if (!songBuffer) return;
    stopPreview();
    setStatus("جارِ تجهيز المعاينة...");
    await new Promise((r) => setTimeout(r, 10));
    try {
      const rhy = await buildRhythmBuffer();
      if (!rhy) return setStatus("");
      const ctx = getCtx();
      const previewStart = Math.max(0, startTime - 2);
      const previewEnd = Math.min(songBuffer.duration, previewStart + 18);
      const mixBuf = buildMix(songBuffer, rhy.buffer, rhy.rStart, rhy.rEnd, songVol, rhythmVol, previewStart, previewEnd);
      limitClipping(mixBuf);

      const src = ctx.createBufferSource();
      src.buffer = mixBuf;
      src.connect(ctx.destination);
      src.start();
      previewNodesRef.current = [src];
      setPreviewing(true);
      setStatus("");
      startPlayhead(ctx, previewStart);
      src.onended = () => { setPreviewing(false); stopPlayhead(); };
    } catch (err) {
      setStatus("تعذّرت المعاينة: " + String(err.message || err));
    }
  };

  const handleRender = async () => {
    if (!songBuffer) return;
    stopPreview();
    setBusy(true);
    setDownloadUrl(null);
    setStatus("جارِ توليف الإيقاع...");
    try {
      const rhy = await buildRhythmBuffer();
      if (!rhy) { setBusy(false); return; }
      setStatus("جارِ دمج الإيقاع مع الأغنية الكاملة...");

      let mixed = buildMix(songBuffer, rhy.buffer, rhy.rStart, rhy.rEnd, songVol, rhythmVol, 0, songBuffer.duration);
      limitClipping(mixed);

      if (masterBoost) {
        setStatus("جارِ تلميع وتقوية الصوت النهائي...");
        const offline = new OfflineAudioContext(mixed.numberOfChannels, mixed.length, mixed.sampleRate);
        const src = offline.createBufferSource();
        src.buffer = mixed;
        const comp = offline.createDynamicsCompressor();
        comp.threshold.value = -10;
        comp.knee.value = 12;
        comp.ratio.value = 3;
        comp.attack.value = 0.003;
        comp.release.value = 0.25;
        src.connect(comp).connect(offline.destination);
        src.start(0);
        mixed = await offline.startRendering();
        mixed = normalizePeak(mixed, -1);
      }

      if (outputSR && mixed.sampleRate !== outputSR) {
        setStatus(`جارِ التحويل لمعدل ${outputSR / 1000}kHz...`);
        mixed = await resampleTo(mixed, outputSR);
        limitClipping(mixed);
      }

      setStatus("جارِ تجهيز ملف WAV للتحميل...");
      const bitDepth = outputQuality === "high" ? 24 : 16;
      const blob = audioBufferToWav(mixed, bitDepth);
      const url = URL.createObjectURL(blob);
      const base = songName.replace(/\.[^/.]+$/, "") || "الأغنية";
      setDownloadUrl(url);
      setDownloadName(`${base} - Tiger Event Mix.wav`);
      setStatus("جاهز! اضغط تحميل الميكس.");
    } catch (err) {
      setStatus("صار خطأ أثناء المعالجة: " + String(err.message || err));
    } finally {
      setBusy(false);
    }
  };

  const handlePreviewFull = async () => {
    if (!songBuffer) return;
    stopPreview();
    setStatus("جارِ تجهيز معاينة المقطع كامل...");
    await new Promise((r) => setTimeout(r, 10));
    try {
      const rhy = await buildRhythmBuffer();
      if (!rhy) return setStatus("");
      const ctx = getCtx();
      const winStart = Math.max(0, startTime - 1);
      const winEnd = Math.min(songBuffer.duration, endTime + 1);
      const mixBuf = buildMix(songBuffer, rhy.buffer, rhy.rStart, rhy.rEnd, songVol, rhythmVol, winStart, winEnd);
      limitClipping(mixBuf);
      const src = ctx.createBufferSource();
      src.buffer = mixBuf;
      src.connect(ctx.destination);
      src.start();
      previewNodesRef.current = [src];
      setPreviewing(true);
      setStatus("");
      startPlayhead(ctx, winStart);
      src.onended = () => { setPreviewing(false); stopPlayhead(); };
    } catch (err) {
      setStatus("تعذّرت المعاينة: " + String(err.message || err));
    }
  };

  const handleBatchExport = async () => {
    if (songFiles.length < 2) return;
    setBatchBusy(true);
    try {
      const ctx = getCtx();
      for (let i = 0; i < songFiles.length; i++) {
        const f = songFiles[i];
        setBatchStatus(`(${i + 1}/${songFiles.length}) تحليل ${f.name}...`);
        await new Promise((r) => setTimeout(r, 10));
        const { bpm: dBpm, beatGrid: grid } = await analyzeRhythm(f.buffer);
        const dDrop = detectDrop(f.buffer);
        const sStart = Math.min(dDrop, f.buffer.duration - 0.5);
        const sEnd = f.buffer.duration;

        let rhythmBuffer;
        let rStart = sStart, rEnd = sEnd;
        const offsetSec = syncOffsetMs / 1000;
        if (rhythmMode === "custom") {
          const loop = myLoops[activeLoopIdx];
          rhythmBuffer = loop ? (loopSyncEnabled ? getSyncedLoopBuffer(loop.buffer, grid, sStart, sEnd, dBpm, loopBeatsCount) : loop.buffer) : null;
          rStart = sStart + offsetSec;
          rEnd = sEnd + offsetSec;
        } else {
          const pattern = PATTERNS.find((p) => p.id === patternId);
          if (grid.length > 2) {
            rhythmBuffer = await buildGridLockedRhythm(pattern, grid, sStart, sEnd, f.buffer.sampleRate, offsetSec);
          } else {
            rhythmBuffer = await buildPhraseBuffer(pattern, dBpm, f.buffer.sampleRate);
            rStart = sStart + offsetSec;
            rEnd = sEnd + offsetSec;
          }
        }
        if (!rhythmBuffer) continue;

        setBatchStatus(`(${i + 1}/${songFiles.length}) دمج ${f.name}...`);
        let mixed = buildMix(f.buffer, rhythmBuffer, rStart, rEnd, songVol, rhythmVol, 0, f.buffer.duration);
        limitClipping(mixed);
        if (masterBoost) {
          const offline = new OfflineAudioContext(mixed.numberOfChannels, mixed.length, mixed.sampleRate);
          const src = offline.createBufferSource();
          src.buffer = mixed;
          const comp = offline.createDynamicsCompressor();
          comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.25;
          src.connect(comp).connect(offline.destination);
          src.start(0);
          mixed = await offline.startRendering();
          mixed = normalizePeak(mixed, -1);
        }
        if (outputSR && mixed.sampleRate !== outputSR) {
          mixed = await resampleTo(mixed, outputSR);
          limitClipping(mixed);
        }
        const bitDepth = outputQuality === "high" ? 24 : 16;
        const blob = audioBufferToWav(mixed, bitDepth);
        const url = URL.createObjectURL(blob);
        const base = f.name.replace(/\.[^/.]+$/, "") || `song-${i + 1}`;
        const a = document.createElement("a");
        a.href = url;
        a.download = `${base} - Tiger Event Mix.wav`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        await new Promise((r) => setTimeout(r, 400));
      }
      setBatchStatus("✅ خلصت معالجة كل الملفات");
    } catch (err) {
      setBatchStatus("صار خطأ بالمعالجة الجماعية: " + String(err.message || err));
    } finally {
      setBatchBusy(false);
    }
  };

  const canWork = !!songBuffer;
  const beatPulseMs = 60000 / bpm;
  const filteredPatterns = PATTERNS.filter((p) => p.category === category);

  return (
    <div style={styles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap');
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        input[type="range"] { -webkit-appearance: none; height: 4px; border-radius: 4px; background: ${COLORS.line}; }
        input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
          background: ${COLORS.gold}; cursor: pointer; border: 2px solid ${COLORS.bg};
        }
        @keyframes pulseRing { 0% { transform: scale(0.85); opacity: 0.9; } 60% { transform: scale(1.5); opacity: 0; } 100% { opacity: 0; } }
        button { cursor: pointer; font-family: 'Cairo', sans-serif; }
        button:disabled { cursor: not-allowed; opacity: 0.4; }
      `}</style>

      <div style={styles.header}>
        <img src={LOGO_DATA_URI} alt="Tiger Event" style={styles.logoImg} />
        <div style={styles.eyebrow}>TIGER EVENT</div>
        <h1 style={styles.title}>مُوَقِّع الإيقاع</h1>
        <p style={styles.subtitle}>عشر إيقاعات بتقسيمات تلقائية، تحليل تنبو، تحرير دقيق، وإخراج بجودة عالية</p>
      </div>

      <section style={styles.card}>
        <div style={styles.stepRow}><span style={styles.stepNum}>01</span><span style={styles.stepTitle}>ارفع الأغنية</span></div>
        <label style={styles.uploadBtn}>
          {loadingSong ? "جارِ التحميل..." : "اختر ملف أو أكثر (mp3 / wav)"}
          <input type="file" accept="audio/*" multiple onChange={handleSongFile} style={{ display: "none" }} />
        </label>

        {songFiles.length > 1 && (
          <div style={styles.songList}>
            {songFiles.map((f, i) => (
              <button key={i} onClick={() => switchToSong(i)} style={i === activeSongIdx ? styles.songChipActive : styles.songChip}>
                {f.name}
              </button>
            ))}
          </div>
        )}
        {songName && songFiles.length <= 1 && <div style={styles.fileName}>{songName}</div>}

        {songBuffer && (
          <>
            <div style={styles.bpmBadgeRow}>
              <span style={styles.bpmBadge}>
                السرعة الحالية: <span className="mono">{bpm} BPM</span>
              </span>
              {beatGrid.length > 2 && <span style={styles.bpmBadgeOk}>✅ محاذى على النبضات الحقيقية</span>}
            </div>

            <div style={styles.zoomRow}>
              <button onClick={() => setZoom((z) => Math.max(1, +(z / 1.6).toFixed(2)))} style={styles.zoomBtn}>－</button>
              <span className="mono" style={styles.zoomLabel}>تكبير ×{zoom.toFixed(1)}</span>
              <button onClick={() => setZoom((z) => Math.min(80, +(z * 1.6).toFixed(2)))} style={styles.zoomBtn}>＋</button>
              <button onClick={() => setZoom(1)} style={styles.zoomReset}>إعادة الضبط</button>
            </div>
            <label style={styles.checkRow}>

            </label>

            <div ref={containerRef} style={{ marginTop: 8 }}>
              <div ref={scrollRef} style={styles.scroller}>
                <div style={{ position: "relative" }}>
                  <canvas
                    ref={canvasRef}

                    onMouseDown={onPointerDown}

                  <canvas ref={overlayCanvasRef} style={styles.overlayCanvas} />

                <canvas ref={rhythmCanvasRef} style={styles.rhythmCanvas} />
              </div>
              <div style={styles.legendRow}>
                {Object.keys(HIT_COLORS).map((k) => (
                  <span key={k} style={styles.legendItem}>
                    <span style={{ ...styles.legendDot, background: HIT_COLORS[k] }} /> {HIT_LABELS[k]}
                  </span>
                ))}
              </div>
              <div style={styles.markerRow}>
                <span><span style={{ color: COLORS.gold }}>● البداية</span> <span className="mono">{fmtTime(startTime)}</span></span>
                <span><span style={{ color: COLORS.coral }}>● النهاية</span> <span className="mono">{fmtTime(endTime)}</span></span>
              </div>

              <div style={styles.numRow}>
                <div style={styles.numField}>
                  <label style={styles.numLabel}>بداية (ثانية)</label>
                  <input
                    type="number" step="0.01" className="mono"
                    value={Number(startTime.toFixed(2))}
                    onChange={(e) => setStartTime(Math.min(Number(e.target.value) || 0, endTime))}
                    style={styles.numInput}
                  />
                </div>
                <div style={styles.numField}>
                  <label style={styles.numLabel}>نهاية (ثانية)</label>
                  <input
                    type="number" step="0.01" className="mono"
                    value={Number(endTime.toFixed(2))}
                    onChange={(e) => setEndTime(Math.max(Number(e.target.value) || 0, startTime + 0.05))}
                    style={styles.numInput}
                  />
                </div>
              </div>

              <div style={styles.sliderBlock}>
                <div style={styles.sliderLabel}>
                  <span>تصحيح التوقيت بالسمع (تزحزح الإيقاع كامل)</span>
                  <span className="mono">{syncOffsetMs > 0 ? "+" : ""}{syncOffsetMs} ms</span>
                </div>
                <input type="range" min={-300} max={300} step={5} value={syncOffsetMs} onChange={(e) => setSyncOffsetMs(Number(e.target.value))} style={{ width: "100%" }} />
                <div style={styles.hint}>لو الإيقاع يجي "متأخر" بالسمع حرّك يمين، ولو "مبكر" حرّك يسار — يعدّل بدون إعادة تحليل</div>
              </div>

              <button onClick={previewing ? stopPreview : handlePreview} style={styles.quickPreviewBtn}>
                {previewing ? "⏹ إيقاف المعاينة" : "▶ معاينة سريعة الآن"}
              </button>

              <div style={styles.hint}>اسحب أقرب علامة لتحديد النطاق — كبّر لترى تطابق كل ضربة مع الموجة، ومرر يمين/يسار للتنقل</div>
              {beatGrid.length > 0 && (
                <label style={styles.checkRow}>
                  <input type="checkbox" checked={snapToGrid} onChange={(e) => setSnapToGrid(e.target.checked)} />
                  🧲 محاذاة على جريد النبضات ({beatGrid.length} ضربة مكتشفة)
                </label>
              )}
            </div>
            <button onClick={handleAutoAnalyze} style={styles.analyzeBtn}>🎯 اكتشاف التنبو والجريد تلقائيًا</button>
            <div style={styles.hint}>الكشف التلقائي تقريبي (تحليل طاقة الصوت) وممكن يخطئ بأغاني معقدة — استخدم التكبير والخانات الرقمية فوق للتأكد وللتعديل الدقيق، ومزلاق تصحيح التوقيت لو حسّيت الإيقاع مو مزبوط بالسمع</div>
          </>

        )}
      </section>


      <section style={{ ...styles.card, ...(canWork ? {} : styles.disabled) }}>
        <div style={styles.stepRow}><span style={styles.stepNum}>02</span><span style={styles.stepTitle}>تحرير دقيق (اختياري)</span></div>
        <div style={styles.editRow}>
          <button onClick={doCopy} style={styles.editBtn}>📋 نسخ</button>
          <button onClick={doCut} style={styles.editBtn}>✂ قص</button>
          <button onClick={doDelete} style={styles.editBtn}>🗑 حذف</button>
          <button onClick={doPaste} style={styles.editBtn} disabled={!hasClipboard}>📥 لصق</button>
          <button onClick={undo} style={styles.editBtn} disabled={historyLen === 0}>↺ تراجع</button>
        </div>
        <div style={styles.hint}>حدد مقطع من الموجة فوق، ثم استخدم الأزرار — اللصق يحصل عند بداية التحديد</div>
      </section>

      <section style={{ ...styles.card, ...(canWork ? {} : styles.disabled) }}>
        <div style={styles.stepRow}><span style={styles.stepNum}>03</span><span style={styles.stepTitle}>اختر الإيقاع</span></div>
        <div style={styles.toggleRow}>
          <button onClick={() => setRhythmMode("builtin")} style={rhythmMode === "builtin" ? styles.toggleActive : styles.toggle}>مكتبة الإيقاعات</button>
          <button onClick={() => setRhythmMode("custom")} style={rhythmMode === "custom" ? styles.toggleActive : styles.toggle}>لوباتي الخاصة</button>
        </div>

        {rhythmMode === "builtin" ? (
          <>
            <div style={styles.catRow}>
              {CATEGORIES.map((c) => (
                <button key={c} onClick={() => setCategory(c)} style={category === c ? styles.catActive : styles.cat}>{c}</button>
              ))}
            </div>
            <div style={styles.patternGrid}>
              {filteredPatterns.map((p) => (
                <button key={p.id} onClick={() => setPatternId(p.id)} style={patternId === p.id ? styles.patternCardActive : styles.patternCard}>
                  <div style={styles.patternName}>{p.name}</div>
                  <div style={styles.patternDesc}>{p.desc}</div>
                </button>
              ))}
            </div>
            <div style={styles.hint}>كل نمط فيه تقسيمة تلقائية كل 4 مازورات — مو تكرار ثابت</div>
            <div style={styles.hint}>{beatGrid.length > 2 ? "✅ الإيقاع محاذى على نبضات الأغنية الحقيقية (اكتشاف تلقائي مفعّل)" : "⚠️ اضغط \"اكتشاف التنبو والجريد تلقائيًا\" فوق حتى يمشي كل دم/تك بالضبط مع نبضات الأغنية الحقيقية"}</div>
          </>
        ) : (
          <div style={{ marginTop: 14 }}>
            <label style={styles.uploadBtnSmall}>
              رفع لوبات (يقدر تختار أكثر من ملف)
              <input type="file" accept="audio/*" multiple onChange={handleLoopFiles} style={{ display: "none" }} />
            </label>
            {myLoops.length > 0 && (
              <div style={styles.patternGrid}>
                {myLoops.map((l, i) => (
                  <button key={i} onClick={() => setActiveLoopIdx(i)} style={activeLoopIdx === i ? styles.patternCardActive : styles.patternCard}>
                    <div style={styles.patternName}>لوب {i + 1}</div>
                    <div style={styles.patternDesc}>{l.name}</div>
                  </button>
                ))}
              </div>
            )}
            {myLoops.length === 0 && <div style={styles.hint}>مكتبتك فاضية — ارفع أول لوب إيقاعي</div>}

            {myLoops[activeLoopIdx] && (
              <div style={{ marginTop: 16 }}>
                <label style={styles.checkRow}>
                  <input type="checkbox" checked={loopSyncEnabled} onChange={(e) => setLoopSyncEnabled(e.target.checked)} />
                  🎚 مزامنة اللوب مع سرعة الأغنية (تمديد/تقصير زمني)
                </label>
                {loopSyncEnabled && (
                  <>
                    <div style={styles.numField}>
                      <label style={styles.numLabel}>كم نبضة (بيت) يغطي هذا اللوب؟</label>
                      <input
                        type="number" min={1} max={16} step={1} className="mono"
                        value={loopBeatsCount}
                        onChange={(e) => setLoopBeatsCount(Math.max(1, Number(e.target.value) || 1))}
                        style={styles.numInput}
                      />
                    </div>
                    <div style={styles.hint}>
                      طول اللوب الأصلي: {myLoops[activeLoopIdx].buffer.duration.toFixed(2)} ثانية — سيتمدد/يتقصّر تلقائيًا ليطابق سرعة الأغنية المكتشفة
                    </div>
                    <div style={styles.hint}>⚠️ التمديد يغيّر طبقة الصوت شوي عند فروقات السرعة الكبيرة (مثل تسريع/تبطيء شريط)</div>
                  </>
                )}
              </div>
            )}
          </div>
        )}
      </section>

      <section style={{ ...styles.card, ...(canWork ? {} : styles.disabled) }}>
        <div style={styles.stepRow}><span style={styles.stepNum}>04</span><span style={styles.stepTitle}>اضبط السرعة والمستوى</span></div>

        {rhythmMode === "builtin" && (
          <div style={styles.bpmRow}>
            <div style={styles.tempoWrap}>
              <button onClick={handleTap} style={styles.tapBtn}>
                <span key={previewing ? "p1" : "p0"} style={{ ...styles.pulseCore, animationDuration: `${beatPulseMs}ms` }} />
                دق
              </button>
              <div>
                <div className="mono" style={styles.bpmValue}>{bpm} BPM</div>
                <input type="range" min={60} max={180} value={bpm} onChange={(e) => setBpm(Number(e.target.value))} style={{ width: 160 }} />
              </div>
            </div>
          </div>
        )}

        <div style={styles.sliderBlock}>
          <div style={styles.sliderLabel}><span>صوت الأغنية الأصلية</span><span className="mono">{Math.round(songVol * 100)}٪</span></div>
          <input type="range" min={0} max={2} step={0.01} value={songVol} onChange={(e) => setSongVol(Number(e.target.value))} style={{ width: "100%" }} />
        </div>
        <div style={styles.sliderBlock}>
          <div style={styles.sliderLabel}><span>صوت الإيقاع المُضاف</span><span className="mono">{Math.round(rhythmVol * 100)}٪</span></div>
          <input type="range" min={0} max={2} step={0.01} value={rhythmVol} onChange={(e) => setRhythmVol(Number(e.target.value))} style={{ width: "100%" }} />
        </div>
      </section>

      <section style={{ ...styles.card, ...(canWork ? {} : styles.disabled) }}>
        <div style={styles.stepRow}><span style={styles.stepNum}>05</span><span style={styles.stepTitle}>جودة الإخراج</span></div>

        <div style={styles.hint}>معدل العينة (Sample Rate)</div>
        <div style={styles.toggleRow}>
          <button onClick={() => setOutputSR(0)} style={outputSR === 0 ? styles.toggleActive : styles.toggle}>أصلي (بدون تحويل)</button>
          <button onClick={() => setOutputSR(44100)} style={outputSR === 44100 ? styles.toggleActive : styles.toggle}>44.1kHz</button>
          <button onClick={() => setOutputSR(48000)} style={outputSR === 48000 ? styles.toggleActive : styles.toggle}>48kHz</button>
        </div>

        <div style={{ ...styles.hint, marginTop: 14 }}>عمق البت (Bit Depth)</div>
        <div style={styles.toggleRow}>
          <button onClick={() => setOutputQuality("standard")} style={outputQuality === "standard" ? styles.toggleActive : styles.toggle}>16-bit</button>

        <div style={styles.stepRow}><span style={styles.stepNum}>06</span><span style={styles.stepTitle}>معاينة وتصدير</span></div>
        <div style={styles.actionRow}>
          <button onClick={previewing ? stopPreview : handlePreview} style={styles.secondaryBtn} disabled={busy}>
            {previewing ? "إيقاف المعاينة" : "▶ معاينة سريعة (18 ثانية)"}
          </button>
          <button onClick={previewing ? stopPreview : handlePreviewFull} style={styles.secondaryBtn} disabled={busy}>
            {previewing ? "إيقاف المعاينة" : "▶ معاينة المقطع كامل"}
          </button>
          <button onClick={handleRender} style={styles.primaryBtn} disabled={busy}>
            {busy ? "جارِ المعالجة..." : "تصدير وتحميل الميكس"}
          </button>
        </div>
        {status && <div style={styles.status}>{status}</div>}
        {downloadUrl && <a href={downloadUrl} download={downloadName} style={styles.downloadBtn}>⬇ تحميل {downloadName}</a>}

        {songFiles.length > 1 && (
          <>
            <div style={styles.hint}>معالجة جماعية: يطبّق نفس النمط والإعدادات الحالية على كل الملفات المرفوعة، ويحلل تنبو وسرعة كل واحد لحاله تلقائيًا</div>
            <button onClick={handleBatchExport} style={styles.batchBtn} disabled={batchBusy}>
              {batchBusy ? "جارِ معالجة الكل..." : `⬇ تصدير كل الملفات (${songFiles.length})`}
            </button>
            {batchStatus && <div style={styles.status}>{batchStatus}</div>}
          </>
        )}
      </section>

      <div style={styles.footer}>Tiger Event — يشتغل كامل داخل المتصفح، الملف ما يترفع لأي سيرفر</div>
    </div>
  );
}
